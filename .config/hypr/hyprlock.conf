# ~/.config/hypr/hyprlock.conf

# BACKGROUND
background {
    monitor =
    path = screenshot   # Takes a screenshot of your current desktop
    blur_passes = 2     # Blurs the background (0 disables it)
    blur_size = 7
    contrast = 0.9
    brightness = 0.8
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 1.0)
    font_size = 70
    font_family = sans-serif
    position = 0, 100
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
